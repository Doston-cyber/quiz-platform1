<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ko'p fanli Quiz Platformasi</title>
    <!-- CSS faylini ulash -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Bosh sahifa (Fanlarni tanlash) -->
        <div id="home-screen" class="screen">
            <h1>Quiz Platformasiga Xush Kelibsiz!</h1>
            <p>O'zingizga qulay fanni tanlang:</p>
            <div class="subject-buttons">
                <button onclick="startQuiz('informatika')">Informatika</button>
                <button onclick="startQuiz('matematika')">Matematika</button>
                <button onclick="startQuiz('tarix')">O'zbekiston va Jahon Tarixi</button>
            </div>
        </div>

        <!-- Quiz (Test ishlash) oynasi -->
        <div id="quiz-screen" class="screen hide">
            <div class="quiz-header">
                <h2 id="subject-title">Fan: ...</h2>
                <div class="quiz-info">
                    <span id="question-counter">Savol: 1 / 100</span>
                    <span id="score-display">Ball: 0</span>
                </div>
            </div>
            <div class="question-box">
                <p id="question-text">Savol matni shu yerda chiqadi...</p>
            </div>
            <div id="options-container" class="options-grid">
                <!-- Variantlar JavaScript orqali dinamik qo'shiladi -->
            </div>
        </div>

        <!-- Natijalar oynasi -->
        <div id="score-screen" class="screen hide">
            <h2>Test yakunlandi! 🎉</h2>
            <p id="final-score">Siz ... ta savoldan ... tasiga to'g'ri javob berdingiz!</p>
            <button onclick="goHome()">Bosh sahifaga qaytish</button>
        </div>
    </div>

    <!-- JavaScript fayllarini ulash tartibi -->
    <script src="informatika.js"></script>
    <script src="matematika.js"></script>
    <script src="tarix.js"></script>
    <script src="script.js"></script>
</body>
</html>
